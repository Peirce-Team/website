<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title & Description -->
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="keywords" content="Charles S. Peirce, semiotics, existential graphs, digital humanities, manuscripts, OCR, HTR, NLP, knowledge graphs, firstness secondness thirdness, semiosis, pragmatism">
  <meta name="author" content="Peirce Interprets Peirce">

  <!-- Canonical URL -->
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/social-preview.jpg">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/social-preview.jpg">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ResearchProject",
    "name": "{{ site.title }}",
    "description": "{{ site.description }}",
    "url": "{{ site.url }}{{ site.baseurl }}",
    "keywords": ["semiotics", "Charles S. Peirce", "digital humanities", "existential graphs", "manuscripts", "NLP", "knowledge graphs"],
    "member": [
      { "@type": "Person", "name": "Davide Picca", "affiliation": "University of Lausanne" },
      { "@type": "Person", "name": "Alessandro Adamou", "affiliation": "Bibliotheca Hertziana – Max Planck Institute for Art History" },
      { "@type": "Person", "name": "Dario Rodighiero", "affiliation": "University of Groningen" },
      { "@type": "Person", "name": "Jeffrey Schnapp", "affiliation": "Harvard University" }
    ],
    "funding": [
      { "@type": "Grant", "funder": { "@type": "Organization", "name": "University of Lausanne" } },
      { "@type": "Grant", "funder": { "@type": "Organization", "name": "RWTH Aachen University" } }
    ]
  }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <nav id="main-nav">
    <a href="#hero" class="nav-logo">Peirce Interprets Peirce</a>
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#objectives">Objectives</a></li>
      <li><a href="#team">Team</a></li>
      <li><a href="#partners">Partners</a></li>
      <li><a href="#publications">Output</a></li>
    </ul>
  </nav>

  {{ content }}

  <script src="{{ '/assets/js/graphs.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
